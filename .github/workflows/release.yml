# Push a tag like v0.1.0 → builds the Windows installer and publishes it to GitHub Releases.
# Installed apps pick it up automatically (electron-updater reads latest.yml from the release).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
